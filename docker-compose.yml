services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance_dashboard
      POSTGRES_USER: finance_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finance_dashboard:${POSTGRES_PASSWORD}@db:5432/finance_dashboard
      JWT_SECRET: ${JWT_SECRET}
      SALARY_TOTAL: ${SALARY_TOTAL:-46200}
    ports:
      - "8001:8000"
volumes:
  db_data:
